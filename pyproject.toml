[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structured-renamer"
dynamic = ["version"]
description = "A structured file renaming tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
sr = "sr.cli.main:main"

[tool.hatch.version]
path = "sr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sr"]

